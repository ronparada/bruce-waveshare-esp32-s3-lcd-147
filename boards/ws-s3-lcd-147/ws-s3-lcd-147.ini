; Waveshare ESP32-S3-LCD-1.47 (USB-A)
; Hardware: ESP32-S3R8, ST7789 172x320 IPS SPI, WS2812 RGB, SD card, BOOT button
; Copy-source: smoochiee-board (nearest ST7789 SPI + 170x320 profile)

[env:ws-s3-lcd-147]
board = ws-s3-lcd-147
build_src_filter = ${env.build_src_filter} +<../boards/ws-s3-lcd-147>
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_flags =
	${env.build_flags}
	-Iboards/ws-s3-lcd-147
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DREDRAW_DELAY=1
	-D USE_HSPI_PORT=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DDEVICE_NAME='"Waveshare S3-LCD-1.47"'

lib_deps =
	${env.lib_deps}
	https://github.com/bmorcelli/ESP32_Button
